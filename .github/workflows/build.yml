name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-latest
            arch: x64
          - name: Windows
            os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The DMG maker uses two small native modules; make sure they are compiled.
      - name: Build native modules for the DMG maker
        if: runner.os == 'macOS'
        run: |
          for m in macos-alias fs-xattr; do
            if [ ! -d "node_modules/$m/build/Release" ]; then
              (cd "node_modules/$m" && npx --yes node-gyp@11 rebuild)
            fi
          done

      - name: Make installers
        run: pnpm make --arch=${{ matrix.arch }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          version=$(node -p "require('./package.json').version")
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp out/make/dmg/${{ matrix.arch }}/*.dmg "dist/Pomodoro-$version-mac-${{ matrix.arch }}.dmg"
            cp out/make/zip/darwin/${{ matrix.arch }}/*.zip "dist/Pomodoro-$version-mac-${{ matrix.arch }}.zip"
          else
            cp out/make/squirrel.windows/${{ matrix.arch }}/*.exe "dist/Pomodoro-$version-windows-${{ matrix.arch }}-setup.exe"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
